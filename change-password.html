<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' http://localhost:8000 http://127.0.0.1:8000; frame-ancestors 'none'; base-uri 'self'; form-action 'self';">
    <title>Change Password - BikeCare</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/forms.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="auth-header text-center">
            <h2>Change Password Required</h2>
            <p class="text-muted">For your security, please update your temporary password before continuing.</p>
        </div>

        <form id="change-pwd-form" class="mt-4">
            <div class="form-group mb-3">
                <label for="old_password">Current / Temporary Password</label>
                <input type="password" id="old_password" class="form-control" required autocomplete="current-password">
            </div>

            <div class="form-group mb-3">
                <label for="new_password">New Password</label>
                <input type="password" id="new_password" class="form-control" required autocomplete="new-password">
                <small class="text-muted">Min 10 characters, including uppercase, lowercase, and a number.</small>
            </div>

            <div class="form-group mb-4">
                <label for="confirm_password">Confirm New Password</label>
                <input type="password" id="confirm_password" class="form-control" required autocomplete="new-password">
            </div>

            <button type="submit" id="btn-submit" class="btn btn-primary w-100">Set New Password</button>
            <button type="button" id="btn-logout" class="btn btn-secondary w-100 mt-2">Log Out</button>
        </form>
    </div>

    <script type="module">
        import { API } from "/js/api.js";
        import { UI } from "/js/ui.js";

        document.getElementById("btn-logout").addEventListener("click", async () => {
            try { await API.post("/auth/logout", {}); } catch (_) {}
            API.clearToken();
            window.location.href = "/login.html";
        });

        document.getElementById("change-pwd-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const oldPass = document.getElementById("old_password").value;
            const newPass = document.getElementById("new_password").value;
            const confirmPass = document.getElementById("confirm_password").value;

            if (newPass !== confirmPass) {
                UI.error("New passwords do not match.");
                return;
            }

            const btn = document.getElementById("btn-submit");
            UI.setLoading(btn, true);

            try {
                await API.post("/auth/change-password", {
                    old_password: oldPass,
                    new_password: newPass
                });
                UI.success("Password updated successfully! Please log in with your new password.");
                setTimeout(() => {
                    API.clearToken();
                    window.location.href = "/login.html";
                }, 1500);
            } catch (err) {
                UI.error(err.message || "Failed to update password.");
            } finally {
                UI.setLoading(btn, false);
            }
        });
    </script>
</body>
</html>
